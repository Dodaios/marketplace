# Contributor-visible validation on every PR. This run executes the PR's own
# code (standard pull_request semantics, read-only token, no secrets) so the
# author gets a red/green check; the AUTHORITATIVE gate that decides the
# auto-merge runs separately from trusted base-branch code (automerge.yml).
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ownership is the rule that cannot be corrected after the fact, so its
      # cases are pinned rather than trusted to hold.
      - name: Ownership rule regression test
        run: python scripts/test_ownership.py
      # The gate merges with no human in the loop, so both trust paths are
      # pinned — above all that a fork cannot reach the trusted one.
      - name: Auto-merge gate regression test
        run: python scripts/test_gate.py
      # An stdio submission runs on the machine of whoever installs it, and
      # each allowed launcher has options that make it a general-purpose
      # runner — so the ARGUMENTS are pinned, not just the launcher name.
      - name: Stdio argument rules regression test
        run: python scripts/test_stdio_arguments.py
      # A bundled skill can grant itself a risk tier or smuggle a payload,
      # and neither is visible in the manifest — so the rules are pinned.
      - name: Bundled skill rules regression test
        run: python scripts/test_bundled_skills.py
      # The storefront shows a package file by file before anyone installs
      # it, and reads that listing from the feed — so the listing is pinned.
      - name: Published file listing regression test
        run: python scripts/test_index_files.py
      # The store shows `npx skills add` beside our own command, but only for
      # the entries that really are portable — so the mark that decides it is
      # pinned, derivation and bounds alike.
      - name: Portability mark regression test
        run: python scripts/test_portable_flavor.py
      # A login is a display name and can be re-registered by a stranger, so
      # the feed has to carry the account NUMBER a consumer joins on. Pinned
      # because losing it again is invisible until somebody renames.
      - name: Publisher account id reaches the feed
        run: python scripts/test_publisher_id.py
      # An agent template is installed on a stranger's machine with no review,
      # so what it may NOT carry (accounts, paths, approval bypasses) is pinned.
      - name: Agent template rules regression test
        run: python scripts/test_agents.py
      # A look is a zip from a stranger's release that the app unpacks. The
      # registry reads it in memory with the app's own rules; those rules,
      # the pinned digest and the feed shape the app reads are pinned here.
      # Pillow lets the test cover the preview re-encode too.
      - name: Install the image toolchain
        run: pip install "Pillow==11.3.0"
      - name: Look rules regression test
        run: python scripts/test_looks.py
      # The issue intake publishes with no human in the loop; the publisher
      # must be the issue's author, never what the JSON claims.
      - name: Issue intake regression test
        run: python scripts/test_intake.py
      # The storefront prints what strangers published. Nothing from the feed
      # may reach a page as markup, and a listing text that says nothing has
      # to fall back to the skill's own description.
      - name: Storefront and listing text regression test
        run: python scripts/test_site.py
      # The publish page builds a submission in the browser and hands it to
      # GitHub. Its logic runs here in Node, against the real intake and
      # validator, so the two halves cannot drift apart.
      - name: Publish page regression test
        run: python scripts/test_publish_flow.py
      # The storefront has to build from what is published right now.
      - name: Build the feed and the storefront
        run: python scripts/build_index.py --out _site
      # The upload endpoint and the app read rules.json instead of retyping
      # the limits. A stale copy would let them accept what CI rejects.
      - name: Published rules match the validator
        run: python scripts/export_rules.py --check
      - name: Validate submissions
        run: |
          if [ -n "${GITHUB_BASE_REF}" ]; then
            git fetch origin "${GITHUB_BASE_REF}"
            python scripts/validate.py --base-ref "origin/${GITHUB_BASE_REF}"
          else
            # On main every look archive was downloaded and checked when it
            # merged; a release that disappears later must not turn main red
            # (the publish build simply stops listing it).
            python scripts/validate.py --no-fetch
          fi
